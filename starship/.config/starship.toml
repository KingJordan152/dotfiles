# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#e0af68)\
[ 󰇥 ](bg:#e0af68 fg:#1a1b26)\
[](bg:#769ff0 fg:#e0af68)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](#394260)\
$fill\
$status\
\n$character
"""

[fill]
symbol = " "

[character]
vimcmd_symbol = '[](bold #9ece6a) '

[directory]
style = "fg:#1A1B26 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "󰋜 "

[git_branch]
symbol = "󰘬"
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[status]
style = "bold italic fg:red"
format = '[ ✘ $status (\($common_meaning$signal_name\))]($style)'
map_symbol = true
disabled = false
